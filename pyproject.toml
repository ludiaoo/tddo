[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tddo"
version = "0.1.0"
description = "Truck-Drone Delivery Optimizer: 带时间窗、双向载荷与时空禁飞区的卡车-无人机联合配送求解器"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "TDDO contributors" }]
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
    "gurobipy==13.0.3",
    "alns==7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ortools>=9.11",
]

[project.scripts]
tddo = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src", "scripts", "configs"]
namespaces = true

[tool.setuptools.package-data]
configs = ["*.toml"]

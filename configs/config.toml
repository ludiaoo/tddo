# 全局参数
# 所有量在代码内部一律 SI：长度 m、时间 s、质量 kg、能量 kWh
# 配置文件里允许用论文原单位（lb / km / h）书写，读取时统一换算（见 src/instance.py 的 UNITS）
#
# 标注 [论文给定] = 论文明确写出的值；[论文未给] = 论文没写，本项目自定，需在 README 说明

[fleet]
drone_speed_kmh = 65.0            # [论文给定] §5
drone_payload_lb = 10.0           # [论文给定] §5
drone_battery_kwh = 0.78          # [论文给定] §5
eta_soc = 0.8                     # [论文未给] 单架次最大可用电量比例，0.8 起试
truck_capacity_lb = 300.0         # [论文给定] §5
launch_s = 60.0                   # [论文未给] 沿用 Murray & Raj (2020) §5.1
recovery_s = 30.0                 # [论文未给] 同上
service_s = 60.0                  # [论文未给] 无人机服务时间；卡车服务时间同取 60 s
drones_per_truck = 1              # [扩展] 每车可同时在飞的架次数；论文约束 20/21 是 1，M9.12 可调
allow_hotswap = false             # [扩展] 同节点先回收再起飞（M9.15）；论文用单个 w_i 禁掉了它

[energy]
# 式(39)：E = d · (e_drone · L + b)
# 注意：论文 Table 2 把 b 的单位标成 kWh，但代入式(39) 时 b 必须与 e_drone·L 同量纲 → 实际是 kWh/km
# 校准依据（论文未给数值，按物理量级定）：
#   电池 0.78 kWh × η 0.8 = 0.624 kWh 可用；空载航程 = 0.624 / b
#   b=0.02 → 31 km（65 km/h 约 29 min），与 0.78 kWh 级配送机相符
#   b=0.05 → 12.5 km（11 min），对这块电池明显不合理，会让绝大多数无人机插入因续航不可行
e_drone_kwh_per_kg_km = 8.0e-4    # 10 lb 载荷使每公里能耗 +18%
b_kwh_per_km = 0.02               # 空载单位距离能耗，对应空载航程约 31 km
e_truck_l_per_km = 0.35           # 重型货车常见值
# [B 项] 悬停功率。论文式(39) 只按飞行距离计电，悬停（等卡车 / 等时间窗）在模型里是**免费**的。
# 0.0 = 论文口径（默认，历史结果逐位不变）。
#
# 标定方式（不用外部拍脑袋的数，改用模型自己的系数）：
#   巡航功率 = b × v = 0.02 kWh/km × 65 km/h = 1.30 kW
#   多旋翼悬停功率 ≈ 0.8–0.9 × 巡航功率（悬停时诱导功率占主导，与巡航同量级）
#   → 取 0.85 倍 = 1.10 kW 作为基准值；0.45 kW（0.35 倍）与 1.80 kW（1.4 倍）作为敏感性端点。
# 量级自检：0.78 kWh 电池在 1.10 kW 下悬停 43 min 见底、在可用 0.624 kWh 下 34 min 见底，
# 与「跨段锚点把悬停从 8.7 min 抬到 57.9 min」直接冲突 —— 这正是 B 项要检验的东西。
hover_power_kw = 0.0

[cost]
c_drone_per_kwh = 0.15            # [论文未给]
c_truck_per_l = 1.30              # [论文未给]
c_customer_per_s = 0.0063         # [论文未给] ≈ 22.7 $/h
# 以上 6 个量论文都只给了符号不给值。M6 会用 Table 3 的成本量级反推校准，
# 校准前只做相对比较（Saving%、相对 truck-only 的降幅），不报绝对美元。

[generation]
# 论文 §5 只说「modified to include additional pickup demands, time window and no-fly zone constraints」
# 具体规则完全未给，以下全部为本项目自定，写进 README 并固定种子
seed = 20261027
pickup_ratio = [0.0, 1.0]         # g_i ~ U(0, ratio·f_i)
demand_rounding_lb = 0.5          # 需求向上取整到 0.5 lb
time_window_offset = 0.9          # e_i 的确定性部分 = offset × τ(depot→i)（0.9 表示「最快可到」略放宽）
time_window_spread_h = [0.0, 3.0] # e_i 再叠加 U(0,3) 小时的随机散布，使窗口铺开在一个工作日内
                                  # 不加散布会让所有窗口挤在前 1.7 h，大算例必然不可行（初版踩过）
time_window_width_min = [30, 90]  # 时间窗宽度 U(30,90) 分钟
day_length_h = 8.0                # 工作日总长，用于校验 l_i 不超过班次
# 禁飞区：按论文 Fig.8 的观感定标 ——「多而小」，不是「少而大」
# 论文四个子图里，10 客户约 2 个、50 客户约 6–7 个、100 客户约 5–6 个；
# 半径均在 150–500 m 量级（轴跨 20–34 km）。初版用 1–2 个 2–4 km 的大圆，
# 会把整簇客户在禁飞期内「禁飞掉」，吃掉论文要考察的绕行机制。
nfz_per_customers = 8             # 数量 = clamp(round(n / 8), min, max)
nfz_count_min = 2
nfz_count_max = 8
# 绝对半径。**刻意大于论文 Fig.8 的观感（150–500 m）**：论文的圆在 20–34 km 的图上只有几百米，
# 但那套标度下我们的绕行通道几乎为零（只有 3.7% 航段需绕、中位 12 m），
# Without-detour 对照组做出来恒等于 0，机制就复现失败了。
# 实测扫描（scripts/probe 一次性的）：半径 250–600 → 绕行率 4–5%；600–1200 → 9–11%；
# 1000–2000 → 绕行率不再涨、而「禁飞阻断」从 8% 涨到 13–19%（开始吃掉整簇客户）。
# 取 600–1200：绕行通道翻倍，且不把机制退化成「任务塌给卡车」。
nfz_radius_m = [600, 1200]
# 禁飞时段以「班次起点 t=0」为基准，必须与时间窗（0–4.9 h）重叠，否则绕行永不触发
# 初版误用 09:00 绝对时刻（32400 s），与 0–17600 s 的时间窗完全不交，时间维度失效
nfz_start_h = [1.0, 2.0]          # 班次开始后 1–2 h 起禁飞
nfz_duration_h = [1.2, 2.2]       # 持续 1.2–2.2 h

[fleet_size]
# 卡车数量 K 论文未给。这里的 capacity 只是**下界**，实际 K 还取「时间窗所需路线数」的较大者
# （见 src/generator.py 里 routes_needed_by_windows）：只按容量算 Set1 是 1 辆，时间窗却要 3 辆。
# 实测：50 节点 6–9 辆、100 节点 10–14 辆 —— 与论文 Fig.8 的 9 / 12 吻合。
policy = "capacity"
capacity_slack = 1.0              # K = ceil(总需求 × slack / 容量)，>1 表示允许留余量
min_trucks = 1
max_trucks = 12

[alns]
initial_temperature = 300.0       # [论文给定]
cooling_rate = 0.99               # [论文给定]
destruction_rate = 0.30           # [论文给定] 30%
max_iterations = 2000             # [论文给定]
max_no_improve = 200              # [论文给定]
weight_global_best = 2.0          # [论文给定]
weight_current_improve = 1.0
weight_accepted = 0.5
weight_rejected = 0.9
seeds = 10                        # 每算例 10 个独立种子取 best

[gurobi]
time_limit_s = 3600               # 小规模验证用，按需调
mip_gap = 0.0
